                var seoTdk = {"listId":"4298","orderNo":197,"keywords":"RISC-V,高性能 RISC-V,性能优化,RVV向量化,编译器参数,内存调优","schemaId":"225","description":"RISC-V 性能优化指南：梳理 -march/-mcpu 编译器配置、RVV 向量化与 LMUL 调优、非对齐访问与 CBO 缓存块操作，面向高性能 RISC-V 应用迁移与调优实践。","listStatus":1,"title":"RISC-V 性能优化实战：编译器参数、RVV 向量化与内存调优 - 玄铁开发者社区","body":"<section><header><div><div><div><nav aria-label=\"主导航\"><div><div><a href=\"https://www.xrvm.cn/\"></a></div><div><span role=\"img\" aria-label=\"search\"><svg viewBox=\"64 64 896 896\" focusable=\"false\" width=\"1em\" height=\"1em\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M909.6 854.5L649.9 594.8C690.2 542.7 712 479 712 412c0-80.2-31.3-155.4-87.9-212.1-56.6-56.7-132-87.9-212.1-87.9s-155.5 31.3-212.1 87.9C143.2 256.5 112 331.8 112 412c0 80.1 31.3 155.5 87.9 212.1C256.5 680.8 331.8 712 412 712c67 0 130.6-21.8 182.7-62l259.7 259.6a8.2 8.2 0 0011.6 0l43.6-43.5a8.2 8.2 0 000-11.6zM570.4 570.4C528 612.7 471.8 636 412 636s-116-23.3-158.4-65.6C211.3 528 188 471.8 188 412s23.3-116.1 65.6-158.4C296 211.3 352.2 188 412 188s116.1 23.2 158.4 65.6S636 352.2 636 412s-23.3 116.1-65.6 158.4z\"></path></svg></span></div><div><a href=\"https://xrvm.com/\">EN</a><a href=\"https://www.xrvm.cn/auth/login?from=%2Fcommunity%2Fpost%2Fdetail%2F4613769882918522880\">登录</a></div></div></nav></div></div></div></header><main><main><div><div><nav><ol><li><span><a href=\"https://www.xrvm.cn/community\">首页</a></span><span>/</span></li><li><span><a href=\"https://www.xrvm.cn/community/post\">博文</a></span><span>/</span></li><li><span>正文</span><span>/</span></li></ol></nav><div><div><h2>RISC-V 性能优化实战：编译器参数、RVV 向量化与内存调优</h2><div><div><div><div><span><img src=\"https://occ-oss-prod.oss-cn-hangzhou.aliyuncs.com/userFiles/4597853516810227712/1784701363270/ScreenShot_2026-07-22_141839_422.png\"></span><div>芯向开源</div></div><div>2026-08-28</div></div><div></div></div><div><img alt=\"收藏\" src=\"https://img.alicdn.com/imgextra/i4/O1CN01UCrw9Q26toOrqlgow_!!6000000007720-2-tps-32-32.png\"><div>0</div></div><div><img alt=\"点赞\" src=\"https://img.alicdn.com/imgextra/i2/O1CN01Mdvf3y1Dt4tOBNCMn_!!6000000000273-2-tps-32-32.png\"><div>0</div></div><div><span role=\"img\" aria-label=\"eye\"><svg viewBox=\"64 64 896 896\" focusable=\"false\" width=\"1em\" height=\"1em\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M942.2 486.2C847.4 286.5 704.1 186 512 186c-192.2 0-335.4 100.5-430.2 300.3a60.3 60.3 0 000 51.5C176.6 737.5 319.9 838 512 838c192.2 0 335.4-100.5 430.2-300.3 7.7-16.2 7.7-35 0-51.5zM512 766c-161.3 0-279.4-81.8-362.7-254C232.6 339.8 350.7 258 512 258c161.3 0 279.4 81.8 362.7 254C791.5 684.2 673.4 766 512 766zm-4-430c-97.2 0-176 78.8-176 176s78.8 176 176 176 176-78.8 176-176-78.8-176-176-176zm0 288c-61.9 0-112-50.1-112-112s50.1-112 112-112 112 50.1 112 112-50.1 112-112 112z\"></path></svg></span><span>13</span></div></div><div>本文从编译器参数、RVV 向量化与内存调优这三方面梳理 RISC-V 上的性能优化路径。</div><div><div><article><div><div><span>将应用从 x86/Arm 迁移到 RISC-V 后，性能往往无法直接对标——同一份 C 代码在不同架构上的表现差异，大部分来自编译器目标配置、向量化策略和内存访问模式这三个环节。本文从这三方面梳理 RISC-V 上的性能优化路径，所有内容基于当前主线工具链和内核的实际支持状态。</span></div><h2 id=\"4ever-bi-4\"><span>一、编译器参数：-march、-mcpu 与 -mtune 的作用层次</span></h2><div><span>RISC-V 的目标配置有三个独立层次，理解其分工是调优的第一步：</span></div><div><div><span>●</span><div step=\"\"><span>-march=rv64gcv</span><span>：决定生成的指令集。只影响\"能用哪些指令\"，不影响调度。指定 v 才会生成 RVV 向量指令。</span></div></div></div><div><div><span>●</span><div step=\"\"><div><div></div></div><span>-mcpu=xt-c920</span><span>：同时设定架构与微架构调度模型（指令成本、流水线参数）。当前上游 GCC 已收录玄铁 xt-c908/xt-c910/xt-c920 等 target（xt-c950 尚在回合中），详见 </span><a target=\"_blank\" href=\"https://gcc.gnu.org/onlinedocs/gcc/RISC-V-Options.html\"><span>GCC RISC-V Options 文档</span></a><span>。</span></div></div></div><div><div><span>●</span><div step=\"\"><span>-mtune=</span><span>：只设定调度模型，不改指令集。适合\"为 A 核调度、在 B 核运行\"的场景。GCC 文档明确 -mcpu 不覆盖 -march 与 -mtune，三者同时指定时 -march 优先决定指令集。</span></div></div></div><div><span>-mtune 的收益与编译器版本、目标核的组合强相关，不存在普遍适用的结论。一个可参考的数据点：在 SiFive U74 这类顺序双发射核上，GCC 12 的 -mtune=sifive-u74 在部分基准中几乎无差异，而同一份 C 代码经 LLVM 加 -mtune 编译后性能提升近一倍——该结果反映的是当时 LLVM RISC-V 后端调度优化尚不充分，不代表任意工具链组合下 -mtune 都有此收益。随着各家后端成熟，这类差异正在收敛，但\"改参数前先测量\"仍是基本原则。</span></div><div><span>代码模型</span><span>：GCC 的 RISC-V 默认代码模型通常为 medlow，要求程序及静态符号位于单个 2 GiB 地址范围内；medany 则允许程序及静态符号位于任意单个 2 GiB 地址范围内，Linux 内核默认采用 medany。实际用户态默认值取决于具体 GCC 构建配置。</span></div><div><span>LTO 与 PGO</span><span>：-flto 在 RISC-V 上与 x86 行为一致，可跨翻译单元内联；PGO（-fprofile-generate/-fprofile-use）对分支密集代码（解析器、状态机）收益明显。两者与 -mcpu 配合使用效果叠加。</span></div><div><span>运行时扩展检测</span><span>：单二进制跨平台运行时，Linux 6.4+ 提供 riscv_hwprobe 系统调用，可查询扩展支持情况和非对齐访问性能：标量非对齐访问可查询 scalar misaligned 性能信息，RVV 场景还可查询 vector misaligned 性能信息。相比传统 HWCAP 查询，riscv_hwprobe 支持多字母扩展名（Zba/Zbb/Zbs），且 key 语义有版本化定义，提供更细粒度的硬件能力信息。GCC/Clang 对 RISC-V 函数多版本化的支持与具体工具链版本和实现方式有关。对于不支持目标形式多版本化的工具链，可以通过拆分编译单元和运行时分发实现不同 ISA/微架构版本，参考 </span><a target=\"_blank\" href=\"https://riscv-optimization-guide.riseproject.dev/\"><span>RISE 项目 RISC-V Optimization Guide</span></a><span>。</span></div><h2 id=\"4ever-bi-39\"><span>二、RVV 向量化：VLEN 无关模型下的正确姿势</span></h2><div><span>RVV 与 x86 AVX 的根本差异是</span><span>VLEN 不是编译期常量</span><span>。向量寄存器组总长 VLEN×LMUL 由硬件决定，软件通过 vsetvli 按剩余数据量动态设置单次处理元素数（VL）。这套模型的核心价值是</span><span>同一份二进制可在 VLEN=128/256/512 的核上运行</span><span>，代价是编译器和开发者都必须写长度无关的代码。</span></div><h3 id=\"4ever-bi-45\"><span>自动向量化现状</span></h3><div><div><span>●</span><div step=\"\"><span>LLVM</span><span>：循环向量化器和 SLP 向量化器均默认开启 RVV 代码生成。-march=rv64gcv 即可触发，无需额外参数。GCC 15 起 -O2 下循环向量化默认更激进。近两年的主要改进：利用 VL 寄存器做 tail folding 消除标量尾部循环——Igalia 在 LLVM RISC-V 后端的一项评测中报告 SPEC CPU 2017 geomean 提升 8.7%，该数字基于其特定评测配置，实际收益随平台与工作负载变化；SLP 支持非 2 的幂向量化（RGB 像素等结构体一次装载）。</span></div></div></div><div><div><span>●</span><div step=\"\"><span>验证手段</span><span>：不要假设循环被向量化了。GCC 用 -fopt-info-vec-missed 查看失败原因，LLVM 用 -Rpass-missed=loop-vectorize。两条命令应进入 CI，防止重构后静默去向量化。</span></div></div></div><h3 id=\"4ever-bi-54\"><span>LMUL 与寄存器压力</span></h3><div><span>-mllvm -riscv-v-register-bit-width-lmul（LLVM）或 -mrvv-max-lmul（GCC）控制循环体内的 LMUL 上限。LMUL 越大，单条指令处理的元素越多，但 32 个物理向量寄存器的预算是硬约束——LMUL=8 时一个向量寄存器组占用 8 个物理寄存器。前述系统评测在同一平台测得，超出寄存器预算触发 spill 后性能下降 8-18 倍，是 LMUL 参数错误中惩罚最重的一项；该数字为评测结果而非通用结论，不同微架构的 spill 代价差异很大。作为参考，该评测中 LMUL=4 配合 4-6 组独立累加器处于安全区间，具体最优配置仍取决于内核结构与目标硬件。</span></div><div><span>一篇对 GCC 15/LLVM 21 在 RVV 1.0 硬件上的系统评测给出了两条值得参考的微基准数据：掩码方式处理尾部元素相比 vsetvli 设置 VL 存在约 35% 的固定开销；自动向量化对 DGEMM 这类复杂内核的生成代码效率仍低——手写 RVV 内在函数（vsetvl + vle64 + vfmacc）的朴素移植即可获得 12 倍于标量的性能。需要说明的是，这两组数字来自该评测的特定编译器版本与硬件组合，不同工具链和核上的表现会有差异，只能作为量级参考。其指向的结论具有普遍性：</span><span>自动向量化适合规则简单循环，计算密集内核依赖 RVV intrinsics 手工优化仍是当前主流实践</span><span>。</span></div><div><span>glibc 层面，memcpy/memset/memcmp 的 RVV 优化近两年已陆续回合上游，采用 vsetvli 自适应循环处理尾部。实际收益取决于运行平台的 RVV 实现效率，不能直接套用 x86 上 SIMD 字符串函数的经验。</span></div><h2 id=\"4ever-bi-66\"><span>三、内存调优：对齐、预取与缓存块操作</span></h2><h3 id=\"4ever-bi-69\"><span>非对齐访问</span></h3><div><span>RISC-V 非对齐访问行为由 PMA（Physical Memory Attributes）决定，不同实现差异极大——有的核拆成多次对齐访问，有的直接陷入异常模拟。优化前先用 riscv_hwprobe 查询 MISALIGNED_FAST。对热数据结构进行适当对齐可以减少跨 cache line 或访问边界带来的额外开销，但具体对齐值应根据目标处理器的 cache line 和内存层次结构确定，不应默认所有 RISC-V 平台均采用 64 字节 cache line；LLVM 编译时可用 -mno-strict-align 控制是否生成非对齐访存指令，默认行为依 -mcpu 目标的微架构特性而定。</span></div><h3 id=\"4ever-bi-75\"><span>CBO 扩展：软件可控的缓存块操作</span></h3><div><span>RISC-V CMO 规范定义了 Zicbop、Zicboz 和 Zicbom 等缓存块操作扩展，Linux RISC-V 内核已提供相应的 ISA 探测和支持：</span></div><div><div><div><table><colgroup><col width=\"216\"><col width=\"216\"><col width=\"216\"></colgroup><tbody><tr><td rowspan=\"1\" colspan=\"1\"><div><span>扩展</span></div></td><td rowspan=\"1\" colspan=\"1\"><div><span>指令</span></div></td><td rowspan=\"1\" colspan=\"1\"><div><span>用途</span></div></td></tr><tr><td rowspan=\"1\" colspan=\"1\"><div><span>Zicbop</span></div></td><td rowspan=\"1\" colspan=\"1\"><div><span>PREFETCH.R / W / I</span></div></td><td rowspan=\"1\" colspan=\"1\"><div><span>软件预取，编译器可将 __builtin_prefetch 映射到该指令</span></div></td></tr><tr><td rowspan=\"1\" colspan=\"1\"><div><span>Zicboz</span></div></td><td rowspan=\"1\" colspan=\"1\"><div><span>CBO.ZERO</span></div></td><td rowspan=\"1\" colspan=\"1\"><div><span>整缓存块清零，可用于优化满足对齐和大小条件的批量清零操作</span></div></td></tr><tr><td rowspan=\"1\" colspan=\"1\"><div><span>Zicbom</span></div></td><td rowspan=\"1\" colspan=\"1\"><div><span>CBO.CLEAN / INVAL / FLUSH</span></div></td><td rowspan=\"1\" colspan=\"1\"><div><span>缓存维护，主要用于非一致 DMA 场景</span></div></td></tr></tbody></table></div><div></div></div></div><div><span>软件预取对规则步进访问且延迟敏感的循环（如流式处理）有效；乱序核的硬件预取通常已覆盖顺序模式，盲目插入 prefetch 指令反而污染缓存。预取收益需以 perf 的 cache-miss 事件验证。</span></div><h3 id=\"4ever-bi-154\"><span>数据布局与 TLB</span></h3><div><div><span>●</span><div step=\"\"><span>AoS → SoA</span><span>：对于需要连续处理同一字段的大规模向量计算，SoA 通常更有利于形成连续访存和高效向量化；但 AoS 并非不能向量化，RVV 可利用 segment load/store 机制处理交错数据布局，LLVM 也提供 vector interleave/deinterleave intrinsic 用于表示和优化交错数据的向量操作。</span></div></div></div><div><div><span>●</span><div step=\"\"><span>Hugepage</span><span>：大内存 footprint 的应用（数据库、大模型推理）开启透明大页（THP，内核 CONFIG_TRANSPARENT_HUGEPAGE，RISC-V 主线已支持）可显著降低 TLB miss 率，这一优化与架构无关但在 RISC-V 平台上同样有效。</span></div></div></div><h2 id=\"4ever-bi-163\"><span>四、性能分析方法</span></h2><div><span>优化前先定位瓶颈，RISC-V 上的工具现状：</span></div><div><div><span>●</span><div step=\"\"><span>perf</span><span>：依赖核实现的 PMU 事件（cycle/instruction 基本可用，cache/branch 事件依实现而定）。perf 计数器语义由具体 PMU 实现定义，使用前可通过已知指令数的微基准校准计数器，确认计数结果与预期一致；具体误差范围取决于 PMU 实现和测量方式。Sscofpmf 扩展（采样溢出与过滤）支撑 perf 的采样模式，新内核已支持。</span></div></div></div><div><div><span>●</span><div step=\"\"><span>Top-Down 微架构分析</span><span>：玄铁 C950 已实现基于 perf 的 TMAM 分层（</span><a target=\"_blank\" href=\"https://www.xrvm.cn/product/xuantie/C950\"><span>C950 产品规格</span></a><span>），可按 Retiring/Frontend Bound/Backend Bound/Bad Speculation 四层拆分 IPC 损失来源，配合 </span><a target=\"_blank\" href=\"https://www.xrvm.cn/community/download\"><span>玄铁资源中心</span></a><span>提供的工具链与性能分析文档使用。相比逐个事件的试错式调优，分层归因能更快定位是取指、分支还是访存问题。</span></div></div></div><h2 id=\"4ever-bi-183\"><span>结语</span></h2><div><span>RISC-V 性能优化的工作量分布大致是：编译器目标配置（-mcpu + LTO）通常是成本最低的改进起点；RVV 向量化面向计算密集内核；内存调优（对齐、布局、预取）面向带宽受限场景。各环节的实际收益高度依赖具体 workload 与目标硬件，前文引用的评测数字只能作为量级参考，不应作为普遍预期。三者的共同前提是可用的测量工具——riscv_hwprobe 查平台特性、编译器 remark 验证向量化、perf/TMAM 定位瓶颈，跳过测量直接调参是性能工作最常见的弯路。</span></div><div><span></span></div><div><span>如需深入了解相关内容，可参考</span><a target=\"_blank\" href=\"https://www.xrvm.cn/knowledge/high-performance-riscv\"><span>高性能 RISC-V 计算页</span></a><span>。</span></div><h3 id=\"4ever-bi-199\"><span>相关阅读</span></h3><div><span></span><a target=\"_blank\" href=\"https://mp.weixin.qq.com/s/5O23A7YkEBuILGIil6pp-g\"><span>Day 0 适配 | 玄铁 RISC-V 处理器支持 Qwen3.8-27B，“Opus 级”Agent 能力落地</span></a><span></span></div><div><span></span><a target=\"_blank\" href=\"https://mp.weixin.qq.com/s/O8wvsP7MUWj_1OWuZHUGJQ\"><span>RISC-V向量扩展在图形处理领域的探索与实践</span></a><span></span></div></div><div></div><div></div></article></div></div><div role=\"separator\"></div><div><span><span>RISC-V</span></span><span><span>RVV </span></span><span><span>编译器</span></span></div><div><div><textarea placeholder=\"请写下你的评论...\" disabled=\"\"></textarea></div><div><div></div><button type=\"button\" disabled=\"\"><span>发布评论</span></button></div><div><span>您尚未登录，请<a>登录</a>后再评论</span></div></div></div></div><div><div>回答（0）</div><div><div><div><img alt=\"非常抱歉，暂无相关数据\" src=\"https://img.alicdn.com/imgextra/i3/O1CN011tp3121iUZvcTAywi_!!6000000004416-2-tps-480-480.png\"></div><div>非常抱歉，暂无相关数据</div></div></div><div><button type=\"button\"></button></div></div></div><div><div><div aria-hidden=\"true\"></div><div><div><div><div><span></span></div><div>文章目录</div><div><a href=\"#mtcjdyf2lie7wy35boq\" title=\"一、编译器参数：-march、-mcpu 与 -mtune 的作用层次\">一、编译器参数：-march、-mcpu 与 -mtune 的作用层次</a></div><div><a href=\"#mtcjdyf2q49cfps5b4\" title=\"二、RVV 向量化：VLEN 无关模型下的正确姿势\">二、RVV 向量化：VLEN 无关模型下的正确姿势</a><div><a href=\"#mtcjdyf23frlvvvpzn\" title=\"自动向量化现状\">自动向量化现状</a></div><div><a href=\"#mtcjdyf2blkvsxudc\" title=\"LMUL 与寄存器压力\">LMUL 与寄存器压力</a></div></div><div><a href=\"#mtcjdyf2z5fe4s9n3x\" title=\"三、内存调优：对齐、预取与缓存块操作\">三、内存调优：对齐、预取与缓存块操作</a><div><a href=\"#mtcjdyf28810hzrhltm\" title=\"非对齐访问\">非对齐访问</a></div><div><a href=\"#mtcjdyf2nvxohtqrmj\" title=\"CBO 扩展：软件可控的缓存块操作\">CBO 扩展：软件可控的缓存块操作</a></div><div><a href=\"#mtcjdyf263qe1hgye0w\" title=\"数据布局与 TLB\">数据布局与 TLB</a></div></div><div><a href=\"#mtcjdyf27htu52ltf1e\" title=\"四、性能分析方法\">四、性能分析方法</a></div><div><a href=\"#mtcjdyf2yisq71j6g8b\" title=\"结语\">结语</a><div><a href=\"#mtcjdyf2zqa70q78drj\" title=\"相关阅读\">相关阅读</a></div></div></div></div></div></div></div></div></main></main><footer><footer><div><div><div></div><div><div></div></div></div><div></div></div><div></div></footer></footer></section><div><div><span></span><div>订阅</div><a target=\"_blank\" href=\"https://www.xrvm.cn/business_cooperation\" rel=\"noreferrer\">商务咨询</a><div><div id=\"AIChatId\"><div><img src=\"https://img.alicdn.com/imgextra/i3/O1CN01eh3NaU1WWA1vcQ66x_!!6000000002795-1-tps-64-64.gif\" alt=\"AI Assistant\"><div><div>AI</div><div>助</div><div>理</div></div></div></div></div><div><img src=\"https://gw.alicdn.com/imgextra/i2/O1CN01kizDap1Y1alqekpdn_!!6000000002999-2-tps-88-88.png\" alt=\"\"></div></div></div>","url":"/community/post/detail/4613769882918522880"};
